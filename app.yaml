command:
  - bash
  - -lc
  - |
    if command -v uv >/dev/null 2>&1; then
      uv sync --no-dev
      uv run streamlit run app.py --server.address=0.0.0.0 --server.port=${PORT:-8000}
    else
      python -m pip install --no-cache-dir -r requirements.txt
      streamlit run app.py --server.address=0.0.0.0 --server.port=${PORT:-8000}
    fi
